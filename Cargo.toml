[package]
name = "ghzinga"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
description = "Terminal UI for monitoring GitHub pull requests and issues."
license = "MIT"
repository = "https://github.com/osolmaz/ghzinga"
homepage = "https://github.com/osolmaz/ghzinga"
documentation = "https://docs.rs/ghzinga"
readme = "README.md"
keywords = ["github", "terminal", "tui", "pull-request", "issues"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "/.agents",
    "/.github",
    "/AGENTS.md",
    "/captures/**",
    "/docs",
    "/fixtures",
    "/plugins",
    "/scripts",
    "/slophammer.yml",
    "/tests",
]
autobins = false

[[bin]]
name = "gzg"
path = "src/main.rs"

[[bin]]
name = "ghzinga"
path = "src/bin/ghzinga.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
getrandom = "0.3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
